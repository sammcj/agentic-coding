<!doctype html>
<!-- Icon concept sheet. Fill-in points:
  1. <symbol id="A".."D">: one per concept, 1024 grid, macOS tile = rect x/y 100, size 824, rx 185.
  2. <symbol id="m1".."m4">, m2idle, m2off: small monochrome glyphs in currentColor on their native grid.
  3. <title>, <h1>, the states card labels, sf-webcam.png (the current icon, from scripts/sf-symbol.swift).
  4. JS arrays: concepts, glyphs (first row = the current icon), about() text.
  Drop sections the product has no surface for. -->
<html><head><meta charset="utf-8"><title>LinkBar icon concepts</title>
<style>
:root{--ink:#1d1d1f;--sub:#6e6e73;--bg:#f5f5f7}
*{box-sizing:border-box}
body{margin:0;padding:40px 48px 64px;background:var(--bg);color:var(--ink);font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
h1{font-size:28px;margin:0 0 28px;letter-spacing:-.3px}
h2{font-size:19px;margin:44px 0 16px;letter-spacing:-.2px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h3{margin:0 0 12px;font-size:14px}
.big{width:100%;aspect-ratio:1;display:block}
.sizes{display:flex;align-items:flex-end;gap:14px;margin-top:10px}
.sizes span{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--sub);font-size:10px}
.dock{display:flex;justify-content:center;gap:14px;padding:12px 18px;margin-top:20px;border-radius:26px;background:rgba(255,255,255,.35);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.5)}
.wall{border-radius:16px;padding:36px 0 24px;background:linear-gradient(135deg,#7b8fb5,#c7a7a0 55%,#e8c9a2)}
/* menu bar */
.mb{display:flex;align-items:center;justify-content:flex-end;gap:18px;height:28px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500}
.mb.light{background:#dcdce1;color:rgba(0,0,0,.85)}
.mb.dark{background:#26262a;color:rgba(255,255,255,.9)}
.mb svg,.mb img{width:20px;height:20px;display:block}
.mb.dark img{filter:invert(1)}
.mb .sel{background:rgba(0,0,0,.12);border-radius:5px;padding:2px 5px}
.mb.dark .sel{background:rgba(255,255,255,.2)}
.mbrow{display:grid;grid-template-columns:150px 1fr 1fr 200px;gap:14px;align-items:center;margin-bottom:10px}
.mbrow b{font-size:13px}
.zoom{display:flex;gap:10px;justify-content:center}
.zoom svg,.zoom img{width:54px;height:54px;color:#1d1d1f}
.states{display:flex;gap:26px;align-items:center}
.states span{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--sub);font-size:11px}
.states svg{width:40px;height:40px}
/* about */
.about{border-radius:12px;padding:26px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.2)}
.about.light{background:#ececec;color:#1d1d1f}
.about.dark{background:#2c2c2e;color:#f5f5f7}
.about svg{width:112px;height:112px}
.about .n{font-size:15px;font-weight:700;margin-top:6px}
.about .v{font-size:11px;opacity:.6;margin-top:3px}
.about .c{font-size:11px;opacity:.75;margin-top:12px;line-height:1.45}
.about .l{font-size:11px;color:#2a6cf0;margin-top:8px}
.about.dark .l{color:#5aa0ff}
.dots{display:flex;gap:7px;margin:-14px 0 12px -6px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
</style></head><body>

<svg width="0" height="0" style="position:absolute">
<defs>
  <radialGradient id="glass" cx="42%" cy="38%" r="70%">
    <stop offset="0" stop-color="#5872ff"/><stop offset=".35" stop-color="#22307a"/><stop offset=".75" stop-color="#070a1c"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5f69"/><stop offset="1" stop-color="#1a1c20"/></linearGradient>
  <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f47"/><stop offset=".5" stop-color="#202328"/><stop offset="1" stop-color="#121417"/></linearGradient>
  <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d9bff"/><stop offset="1" stop-color="#2442c9"/></linearGradient>
  <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c313b"/><stop offset="1" stop-color="#0c0e12"/></linearGradient>
  <linearGradient id="accB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#3d6bff"/></linearGradient>
  <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfcfe"/><stop offset="1" stop-color="#d5dce8"/></linearGradient>
  <linearGradient id="accC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset="1" stop-color="#2a55e0"/></linearGradient>
  <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fd0bd"/><stop offset="1" stop-color="#0a6f7c"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
  <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  <clipPath id="crossTop"><rect x="430" y="280" width="200" height="190"/></clipPath>

  <g id="lens">
    <circle r="1" fill="url(#bezel)"/>
    <circle r=".86" fill="#08090b"/>
    <circle r=".74" fill="url(#glass)"/>
    <circle r=".44" fill="none" stroke="#9fb4ff" stroke-opacity=".28" stroke-width=".03"/>
    <ellipse cx="-.28" cy="-.3" rx=".24" ry=".13" fill="#fff" fill-opacity=".6" transform="rotate(-35 -.28 -.3)"/>
    <circle cx=".3" cy=".3" r=".06" fill="#fff" fill-opacity=".35"/>
  </g>
</defs>

<!-- A: the camera itself -->
<symbol id="A" viewBox="0 0 1024 1024">
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgA)"/>
  <g clip-path="url(#sq)">
    <ellipse cx="512" cy="770" rx="250" ry="26" fill="#000" opacity=".22"/>
    <path d="M452 630 H572 L596 752 H428 Z" fill="#17191d"/>
    <rect x="404" y="742" width="216" height="26" rx="13" fill="#24272c"/>
    <g filter="url(#shadow)">
      <rect x="192" y="320" width="640" height="320" rx="112" fill="url(#bodyG)"/>
    </g>
    <rect x="192" y="320" width="640" height="320" rx="112" fill="url(#sheen)"/>
    <rect x="195" y="323" width="634" height="314" rx="109" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="4"/>
    <use href="#lens" transform="translate(512 480) scale(128)"/>
    <circle cx="726" cy="420" r="12" fill="#43e08f"/>
    <circle cx="726" cy="420" r="24" fill="#43e08f" opacity=".18"/>
    <g fill="#000" opacity=".55"><circle cx="292" cy="420" r="6"/><circle cx="312" cy="420" r="6"/><circle cx="332" cy="420" r="6"/></g>
  </g>
</symbol>

<!-- B: auto-framing brackets around a lens -->
<symbol id="B" viewBox="0 0 1024 1024">
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgB)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)" opacity=".35"/>
  <g fill="none" stroke="url(#accB)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 382 V302 Q262 262 302 262 H382"/>
    <path d="M642 262 H722 Q762 262 762 302 V382"/>
    <path d="M762 642 V722 Q762 762 722 762 H642"/>
    <path d="M382 762 H302 Q262 762 262 722 V642"/>
  </g>
  <use href="#lens" transform="translate(512 512) scale(165)"/>
</symbol>

<!-- C: camera bar framing a person -->
<symbol id="C" viewBox="0 0 1024 1024">
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgC)"/>
  <g clip-path="url(#sq)">
    <path d="M512 300 L300 930 H724 Z" fill="#4f8bff" opacity=".10"/>
    <circle cx="512" cy="560" r="104" fill="url(#accC)"/>
    <path d="M300 930 C300 760 400 690 512 690 C624 690 724 760 724 930 Z" fill="url(#accC)"/>
    <g fill="none" stroke="#2a55e0" stroke-opacity=".55" stroke-width="22" stroke-linecap="round">
      <path d="M332 470 V430 H372"/><path d="M652 430 H692 V470"/>
      <path d="M692 770 V810 H652"/><path d="M372 810 H332 V770"/>
    </g>
    <g filter="url(#shadow)"><rect x="232" y="182" width="560" height="196" rx="70" fill="url(#bodyG)"/></g>
    <rect x="232" y="182" width="560" height="196" rx="70" fill="url(#sheen)"/>
    <use href="#lens" transform="translate(512 280) scale(76)"/>
    <circle cx="700" cy="244" r="9" fill="#43e08f"/>
  </g>
</symbol>

<!-- D: chain link, one loop is the lens -->
<symbol id="D" viewBox="0 0 1024 1024">
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgD)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)" opacity=".5"/>
  <rect x="196" y="402" width="420" height="220" rx="110" fill="none" stroke="#f4fbfa" stroke-width="64"/>
  <g filter="url(#shadow)"><circle cx="652" cy="512" r="176" fill="url(#bezel)"/></g>
  <circle cx="652" cy="512" r="140" fill="#08090b"/>
  <use href="#lens" transform="translate(652 512) scale(126)"/>
  <rect x="196" y="402" width="420" height="220" rx="110" fill="none" stroke="#f4fbfa" stroke-width="64" clip-path="url(#crossTop)"/>
</symbol>

<!-- Menu bar template glyphs, 20x20, currentColor -->
<symbol id="m1" viewBox="0 0 20 20"><rect x="2.2" y="5.6" width="15.6" height="8" rx="2.8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="9.6" r="2.3" fill="currentColor"/></symbol>
<symbol id="m2" viewBox="0 0 20 20"><mask id="m2m"><rect width="20" height="20" fill="#fff"/><circle cx="10" cy="8.4" r="2.6" fill="#000"/><circle cx="10" cy="8.4" r="1.2" fill="#fff"/></mask><rect x="2" y="4.4" width="16" height="8" rx="2.8" fill="currentColor" mask="url(#m2m)"/><path d="M8.6 12.4h2.8l.5 2.6H8.1z" fill="currentColor"/><rect x="6.6" y="14.6" width="6.8" height="1.4" rx=".7" fill="currentColor"/></symbol>
<symbol id="m3" viewBox="0 0 20 20"><rect x="2.2" y="4.6" width="15.6" height="7.8" rx="2.8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="8.5" r="2.1" fill="currentColor"/><path d="M8.7 13.1h2.6l.4 2H8.3z" fill="currentColor"/><rect x="6.6" y="14.8" width="6.8" height="1.3" rx=".65" fill="currentColor"/></symbol>
<symbol id="m4" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6.5V4.5Q3 3 4.5 3H6.5"/><path d="M13.5 3H15.5Q17 3 17 4.5V6.5"/><path d="M17 13.5V15.5Q17 17 15.5 17H13.5"/><path d="M6.5 17H4.5Q3 17 3 15.5V13.5"/></g><circle cx="10" cy="10" r="3.3" fill="currentColor"/></symbol>
<!-- states for m2 -->
<symbol id="m2idle" viewBox="0 0 20 20"><rect x="2.7" y="5.1" width="14.6" height="6.6" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="8.4" r="1.7" fill="currentColor"/><path d="M8.6 12.4h2.8l.5 2.6H8.1z" fill="currentColor"/><rect x="6.6" y="14.6" width="6.8" height="1.4" rx=".7" fill="currentColor"/></symbol>
<symbol id="m2off" viewBox="0 0 20 20"><use href="#m2idle" opacity=".38"/></symbol>
</svg>

<h1>LinkBar icon concepts</h1>

<h2>App icon</h2>
<div class="grid" id="icons"></div>
<div class="wall" style="margin-top:20px"><div class="dock" style="width:max-content;margin:0 auto" id="dock"></div></div>
<div class="wall" style="margin-top:14px;background:linear-gradient(135deg,#141824,#2a2238 60%,#3a2a2a)"><div class="dock" style="width:max-content;margin:0 auto;background:rgba(30,30,30,.5);border-color:rgba(255,255,255,.12)" id="dockDark"></div></div>

<h2>Menu bar</h2>
<div id="mb"></div>
<div class="card" style="margin-top:14px">
  <h3>m2 states</h3>
  <div class="states">
    <span><svg style="color:#1d1d1f"><use href="#m2idle"/></svg>idle</span>
    <span><svg style="color:#1d1d1f"><use href="#m2"/></svg>streaming</span>
    <span><svg style="color:#1d1d1f"><use href="#m2off"/></svg>no camera</span>
    <span style="background:#26262a;padding:10px 12px;border-radius:10px;flex-direction:row;gap:22px">
      <svg style="color:#fff"><use href="#m2idle"/></svg><svg style="color:#fff"><use href="#m2"/></svg><svg style="color:#fff"><use href="#m2off"/></svg></span>
  </div>
</div>

<h2>About panel</h2>
<div class="grid" id="about"></div>
<div class="grid" id="aboutDark" style="margin-top:20px"></div>

<script>
const concepts=[["A","Device"],["B","Framing"],["C","Bar + subject"],["D","Link"]];
const ic=(id,s)=>'<svg width="'+s+'" height="'+s+'"><use href="#'+id+'"/></svg>';
document.getElementById('icons').innerHTML=concepts.map(([id,n])=>
  '<div class="card"><h3>'+id+'. '+n+'</h3><svg class="big"><use href="#'+id+'"/></svg>'+
  '<div class="sizes">'+[128,64,32,16].map(s=>'<span>'+ic(id,s)+s+'</span>').join('')+'</div>'+
  '<div class="sizes" style="background:#1e1e1e;border-radius:10px;padding:8px 10px;margin-top:10px">'+[64,32,16].map(s=>'<span>'+ic(id,s)+'</span>').join('')+'</div></div>').join('');
for(const d of ['dock','dockDark'])document.getElementById(d).innerHTML=concepts.map(([id])=>ic(id,72)).join('');
const glyphs=[["current","<img src='sf-webcam.png'>"],["m1 outline",'<svg><use href="#m1"/></svg>'],["m2 solid + mount",'<svg><use href="#m2"/></svg>'],["m3 outline + mount",'<svg><use href="#m3"/></svg>'],["m4 framing",'<svg><use href="#m4"/></svg>']];
const bar=(cls,g)=>'<div class="mb '+cls+'"><span>⌥</span><span class="sel">'+g+'</span><span>100%</span><span>Fri 27 Nov  9:41</span></div>';
document.getElementById('mb').innerHTML=glyphs.map(([n,g])=>'<div class="mbrow"><b>'+n+'</b>'+bar('light',g)+bar('dark',g)+'<div class="zoom">'+g+'</div></div>').join('');
const about=(id,cls)=>'<div class="about '+cls+'"><div class="dots"><i></i><i></i><i></i></div>'+ic(id,112).replace('width="112" height="112"','')+'<div class="n">LinkBar</div><div class="v">Version 0.1.0</div><div class="c">Menu bar controls for<br>Insta360 Link cameras</div><div class="l">example.com/app</div></div>';
document.getElementById('about').innerHTML=concepts.map(([id])=>about(id,'light')).join('');
document.getElementById('aboutDark').innerHTML=concepts.map(([id])=>about(id,'dark')).join('');
</script>
</body></html>
