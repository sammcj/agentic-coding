[project]
name = "openspeccer"
version = "0.1.1"
description = "Read-only dashboard and explorer for OpenSpec repositories"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The version guard has to run on interpreters older than the target.
"scripts/serve.py" = ["UP031", "UP036"]

[tool.pyright]
extraPaths = ["scripts"]
pythonVersion = "3.12"

[tool.ty.environment]
python-version = "3.12"
